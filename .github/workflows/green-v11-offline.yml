name: Green V1.1 isolated Linux verification

on:
  push:
    branches: [feat/green-v1.1-issue4]
    paths:
      - projects/green-migration/v1.1/**/*.sh
      - projects/green-migration/v1.1/**/*.py
      - projects/green-migration/v1.1/**/*.groovy
      - projects/green-migration/v1.1/**/*.txt
      - .github/workflows/green-v11-offline.yml

permissions:
  contents: read

jobs:
  offline-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Native validation tools
        timeout-minutes: 7
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/green-evidence"
          missing=()
          command -v shellcheck >/dev/null || missing+=(shellcheck)
          command -v groovyc >/dev/null || missing+=(groovy)
          command -v java >/dev/null || missing+=(default-jre-headless)
          command -v rsync >/dev/null || missing+=(rsync)
          if ((${#missing[@]})); then
            # Reuse the hosted image's package index first. Unrelated apt
            # sources must not hold this isolated matrix indefinitely.
            apt_options=(-o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            if ! sudo timeout 120 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"; then
              sudo timeout 90 apt-get "${apt_options[@]}" update
              sudo timeout 120 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
            fi
          fi
          echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")" >> "$GITHUB_ENV"
          { python3 --version; shellcheck --version; groovyc --version; rsync --version | head -n 1; } > "$RUNNER_TEMP/green-evidence/tools.txt"
      - name: Verify exact source and isolated migration matrix
        env:
          PYTHON: python3
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/green-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/green-evidence/commit.txt"
          bash projects/green-migration/v1.1/verify_offline.sh --report "$RUNNER_TEMP/green-evidence/linux-matrix.json" 2>&1 | tee "$RUNNER_TEMP/green-evidence/verify.log"
      - name: Preserve evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: green-v11-offline-${{ github.sha }}
          path: ${{ runner.temp }}/green-evidence/
          if-no-files-found: error
          retention-days: 14
